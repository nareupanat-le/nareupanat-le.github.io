<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฝึกหัดลิมิตแคลคูลัส</title>
    <!-- การตั้งค่า MathJax เพื่อรองรับ LaTeX และ Displaystyle -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Sarabun", "Segoe UI", Roboto, sans-serif; 
            background-color: #f4f6f9; 
            padding: 30px 15px; 
            color: #333;
        }
        .card { 
            background: white; 
            max-width: 680px; 
            margin: 0 auto; 
            padding: 28px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); 
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: #1a202c;
        }
        .btn-group { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            margin: 20px 0; 
            justify-content: center; 
        }
        .btn { 
            padding: 10px 18px; 
            border: none; 
            border-radius: 6px; 
            font-size: 0.95rem;
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s ease; 
            color: white; 
        }
        .btn-blue { background: #0066cc; }
        .btn-green { background: #28a745; }
        .btn-cyan { background: #17a2b8; }
        .btn:hover { opacity: 0.88; transform: translateY(-1px); }
        .box { 
            margin-top: 15px; 
            padding: 18px; 
            border-radius: 8px; 
            background: #f8f9fa; 
            border-left: 4px solid #0066cc; 
            font-size: 1.05rem; 
            line-height: 1.8; 
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>แบบฝึกหัดลิมิตแบบสุ่ม (รูปแบบไม่กำหนด $\frac{0}{0}$)</h2>
    
    <div class="btn-group">
        <button class="btn btn-blue" onclick="generateProblem()">1. สุ่มโจทย์ใหม่</button>
        <button class="btn btn-green" onclick="showAnswer()">2. ดูคำตอบ</button>
        <button class="btn btn-cyan" onclick="showSolution()">3. ดูวิธีทำอย่างละเอียด</button>
    </div>

    <!-- พื้นที่แสดงผล 3 จังหวะ -->
    <div id="probBox" class="box"><em>กดปุ่ม "1. สุ่มโจทย์ใหม่" เพื่อเริ่มต้นทำแบบฝึกหัด</em></div>
    <div id="ansBox" class="box hidden"></div>
    <div id="solBox" class="box hidden"></div>
</div>

<script>
let currentProb = null;

function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { let t = b; b = a % b; a = t; }
    return a;
}

function toFrac(n, d) {
    if (d < 0) { n = -n; d = -d; }
    let g = gcd(n, d);
    n /= g; d /= g;
    if (d === 1) return `${n}`;
    return `\\frac{${n}}{${d}}`;
}

function poly1(p, q) {
    if (p === 0) return `${q}`;
    let termX = (p === 1) ? "x" : (p === -1 ? "-x" : `${p}x`);
    if (q === 0) return termX;
    return q > 0 ? `${termX} + ${q}` : `${termX} - ${Math.abs(q)}`;
}

function poly2(A, B, C) {
    let res = "";
    if (A === 1) res += "x^{2}";
    else if (A === -1) res += "-x^{2}";
    else if (A !== 0) res += `${A}x^{2}`;

    if (B !== 0) {
        let sign = B > 0 ? (res ? " + " : "") : " - ";
        let absB = Math.abs(B);
        res += `${sign}${absB === 1 ? "" : absB}x`;
    }
    if (C !== 0) {
        let sign = C > 0 ? (res ? " + " : "") : " - ";
        res += `${sign}${Math.abs(C)}`;
    }
    return res || "0";
}

function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function formatRoot(k, b) {
    let termX = (k === 1) ? "x" : `${k}x`;
    if (b === 0) return `\\sqrt{${termX}}`;
    return b > 0 ? `\\sqrt{${termX} + ${b}}` : `\\sqrt{${termX} - ${Math.abs(b)}}`;
}

function generateProblem() {
    let a = rand(-3, 4);
    let termCancel = a >= 0 ? (a === 0 ? "x" : `x - ${a}`) : `x + ${Math.abs(a)}`;
    let type = Math.random() < 0.4 ? 'factoring' : 'conjugate';
    
    let probLatex = "";
    let finalVal = "";
    let solText = "";

    if (type === 'factoring') {
        let p1 = rand(1, 3), q1 = rand(-3, 3);
        let p2 = rand(1, 3), q2 = rand(-3, 3);
        while (p2 * a + q2 === 0) { q2 = rand(-3, 3); }

        let deg1 = rand(1, 2), deg2 = rand(1, 2);
        let numExp = (deg1 === 2) ? poly2(p1, q1 - a * p1, -a * q1) : poly1(p1, -a * p1);
        let denExp = (deg2 === 2) ? poly2(p2, q2 - a * p2, -a * q2) : poly1(p2, -a * p2);

        let numFact = (deg1 === 2) ? `(${termCancel})(${poly1(p1, q1)})` : `${p1 === 1 ? "" : p1}(${termCancel})`;
        let denFact = (deg2 === 2) ? `(${termCancel})(${poly1(p2, q2)})` : `${p2 === 1 ? "" : p2}(${termCancel})`;

        let numSimp = (deg1 === 2) ? poly1(p1, q1) : `${p1}`;
        let denSimp = (deg2 === 2) ? poly1(p2, q2) : `${p2}`;

        finalVal = toFrac(p1 * a + q1, p2 * a + q2);
        probLatex = `\\lim_{x \\to ${a}} \\frac{${numExp}}{${denExp}}`;

        solText = `<b>วิธีทำอย่างละเอียด:</b><br>` +
                  `1. แทนค่า $x = ${a}$ จะพบว่าอยู่ในรูปแบบ $\\frac{0}{0}$<br>` +
                  `2. แยกตัวประกอบของเศษและส่วน:<br>` +
                  `   $$\\displaystyle ${probLatex} = \\lim_{x \\to ${a}} \\frac{${numFact}}{${denFact}}$$<br>` +
                  `3. ตัดทอนพจน์ร่วม $(${termCancel})$ ออก:<br>` +
                  `   $$\\displaystyle = \\lim_{x \\to ${a}} \\frac{${numSimp}}{${denSimp}}$$<br>` +
                  `4. แทนค่า $x = ${a}$ ในพจน์ที่เหลือ:<br>` +
                  `   $$\\displaystyle = ${finalVal}$$`;
    } else {
        let k = rand(1, 3);          
        let c = rand(1, 4);          
        let b = c * c - k * a;       
        let rootStr = formatRoot(k, b);
        
        let rootPos = Math.random() < 0.5 ? 'num' : 'den';       
        let rootOrder = Math.random() < 0.5 ? 'rootFirst' : 'constFirst'; 

        let rootPartExp = (rootOrder === 'rootFirst') ? `${rootStr} - ${c}` : `${c} - ${rootStr}`;
        let conj = (rootOrder === 'rootFirst') ? `${rootStr} + ${c}` : `${c} + ${rootStr}`;
        let factorMultiplier = (rootOrder === 'rootFirst') ? k : -k;

        let p = rand(1, 2), q = rand(-3, 3);
        while (p * a + q === 0) { q = rand(-3, 3); }
        let polyDeg = rand(1, 2);
        let polyExp = (polyDeg === 2) ? poly2(p, q - a * p, -a * q) : poly1(p, -a * p);
        let polyFact = (polyDeg === 2) ? `(${termCancel})(${poly1(p, q)})` : `${p === 1 ? "" : p}(${termCancel})`;
        let polySimp = (polyDeg === 2) ? `(${poly1(p, q)})` : (p === 1 ? "" : `${p}`);

        if (rootPos === 'num') {
            probLatex = `\\lim_{x \\to ${a}} \\frac{${rootPartExp}}{${polyExp}}`;
            let numSimpText = factorMultiplier === 1 ? `(${termCancel})` : (factorMultiplier === -1 ? `-(${termCancel})` : `${factorMultiplier}(${termCancel})`);
            let numAfterCancel = `${factorMultiplier}`;
            let denAfterCancel = polySimp ? `${polySimp}(${conj})` : `(${conj})`;

            let polyVal = p * a + q;
            let conjVal = 2 * c;
            finalVal = toFrac(factorMultiplier, polyVal * conjVal);

            solText = `<b>วิธีทำอย่างละเอียด:</b><br>` +
                      `1. แทนค่า $x = ${a}$ จะพบว่าอยู่ในรูปแบบ $\\frac{0}{0}$<br>` +
                      `2. คูณด้วยสังยุค (Conjugate) $(${conj})$ ทั้งเศษและส่วน:<br>` +
                      `   $$\\displaystyle ${probLatex} = \\lim_{x \\to ${a}} \\frac{(${rootPartExp})(${conj})}{(${polyExp})(${conj})}$$<br>` +
                      `3. จัดรูปผลต่างกำลังสองที่ตัวเศษและแยกตัวประกอบตัวส่วน:<br>` +
                      `   $$\\displaystyle = \\lim_{x \\to ${a}} \\frac{${numSimpText}}{${polyFact}(${conj})}$$<br>` +
                      `4. ตัดทอนพจน์ร่วม $(${termCancel})$ ออก:<br>` +
                      `   $$\\displaystyle = \\lim_{x \\to ${a}} \\frac{${numAfterCancel}}{${denAfterCancel}}$$<br>` +
                      `5. แทนค่า $x = ${a}$ ในพจน์ที่เหลือ:<br>` +
                      `   $$\\displaystyle = ${finalVal}$$`;
        } else {
            probLatex = `\\lim_{x \\to ${a}} \\frac{${polyExp}}{${rootPartExp}}`;
            let denSimpText = factorMultiplier === 1 ? `(${termCancel})` : (factorMultiplier === -1 ? `-(${termCancel})` : `${factorMultiplier}(${termCancel})`);
            let numAfterCancel = polySimp ? `${polySimp}(${conj})` : `(${conj})`;
            let denAfterCancel = `${factorMultiplier}`;

            let polyVal = p * a + q;
            let conjVal = 2 * c;
            finalVal = toFrac(polyVal * conjVal, factorMultiplier);

            solText = `<b>วิธีทำอย่างละเอียด:</b><br>` +
                      `1. แทนค่า $x = ${a}$ จะพบว่าอยู่ในรูปแบบ $\\frac{0}{0}$<br>` +
                      `2. คูณด้วยสังยุค (Conjugate) $(${conj})$ ทั้งเศษและส่วน:<br>` +
                      `   $$\\displaystyle ${probLatex} = \\lim_{x \\to ${a}} \\frac{(${polyExp})(${conj})}{(${rootPartExp})(${conj})}$$<br>` +
                      `3. แยกตัวประกอบตัวเศษและจัดรูปผลต่างกำลังสองที่ตัวส่วน:<br>` +
                      `   $$\\displaystyle = \\lim_{x \\to ${a}} \\frac{${polyFact}(${conj})}{${denSimpText}}$$<br>` +
                      `4. ตัดทอนพจน์ร่วม $(${termCancel})$ ออก:<br>` +
                      `   $$\\displaystyle = \\lim_{x \\to ${a}} \\frac{${numAfterCancel}}{${denAfterCancel}}$$<br>` +
                      `5. แทนค่า $x = ${a}$ ในพจน์ที่เหลือ:<br>` +
                      `   $$\\displaystyle = ${finalVal}$$`;
        }
    }

    // กำหนดคำสั่งโจทย์ และจัดสมการแบบ displaystyle
    currentProb = {
        prob: `<b>คำสั่ง:</b> จงหาค่าของลิมิตต่อไปนี้<br>$$\\displaystyle ${probLatex}$$`,
        ans: `$\\displaystyle ${finalVal}$`,
        sol: solText
    };

    document.getElementById('ansBox').classList.add('hidden');
    document.getElementById('solBox').classList.add('hidden');
    document.getElementById('probBox').innerHTML = currentProb.prob;
    MathJax.typesetPromise();
}

function showAnswer() {
    if (!currentProb) return;
    let box = document.getElementById('ansBox');
    box.innerHTML = `<b>คำตอบ:</b> ${currentProb.ans}`;
    box.classList.remove('hidden');
    MathJax.typesetPromise();
}

function showSolution() {
    if (!currentProb) return;
    let box = document.getElementById('solBox');
    box.innerHTML = currentProb.sol;
    box.classList.remove('hidden');
    MathJax.typesetPromise();
}
</script>

</body>
</html>
